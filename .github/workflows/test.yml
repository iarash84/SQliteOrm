name: Test

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore SQliteOrm.sln

      - name: Build
        run: dotnet build SQliteOrm.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test SQliteOrm.sln --configuration Release --no-build --no-restore --verbosity normal
